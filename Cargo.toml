[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/shared",
    "crates/catalog",
    "crates/enrollment",
    "crates/scorm",
    "crates/management",
    "crates/host",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/martinongtangco/LibreLMS-rustedition"

[workspace.dependencies]
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tiberius = { version = "0.13", features = ["tokio"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
askama = "0.12"
cookie = "0.18"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
lto = "thin"
